interface:
  display_name: "jev"
  short_description: "Jev selects build turns, model routing and safe Git steps"
  default_prompt: "Use $jev to build, route or decide the next Git step."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "jev-loop"
      description: "jev-loop MCP server: loop_start, loop_decide, loop_record_turn, loop_record_review, loop_status"
      transport: "stdio"